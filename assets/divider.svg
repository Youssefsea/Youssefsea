<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 30" width="1000" height="30" role="img" aria-label="Section divider">
  <defs>
    <linearGradient id="l" x1="0" x2="1">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset=".5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <style>
      .d{transform-box:fill-box;transform-origin:center;animation:sp 3s ease-in-out infinite}
      @keyframes sp{0%,100%{transform:rotate(45deg) scale(1)}50%{transform:rotate(225deg) scale(1.25)}}
      .dot{animation:mv 4s linear infinite}
      @keyframes mv{0%{transform:translateX(-380px);opacity:0}20%,80%{opacity:1}100%{transform:translateX(380px);opacity:0}}
    </style>
  </defs>
  <rect x="100" y="14" width="800" height="2" rx="1" fill="url(#l)"/>
  <circle class="dot" cx="500" cy="15" r="3" fill="#FEF3C7"/>
  <circle cx="450" cy="15" r="3" fill="#38BDF8"/>
  <circle cx="550" cy="15" r="3" fill="#38BDF8"/>
  <rect class="d" x="492" y="7" width="16" height="16" rx="3" fill="#7C3AED" stroke="#FEF3C7" stroke-width="2"/>
</svg>
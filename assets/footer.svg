<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Night city skyline with a rocket — keep learning, keep building">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#09090F"/><stop offset=".6" stop-color="#312E81"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <clipPath id="r"><rect width="1000" height="220" rx="28"/></clipPath>
    <style>
      text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
      .tw{animation:tw 2.6s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
      .rk{animation:rk 7s ease-in-out infinite}
      @keyframes rk{0%{transform:translate(580px,250px);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translate(960px,-30px);opacity:0}}
      .fire{transform-box:fill-box;transform-origin:top center;animation:fi .25s ease-in-out infinite alternate}
      @keyframes fi{from{transform:scaleY(.7)}to{transform:scaleY(1.2)}}
    </style>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1000" height="220" fill="url(#sky)"/>
    <g fill="#fff">
      <circle class="tw" cx="60" cy="30" r="2"/><circle class="tw" style="animation-delay:-1s" cx="170" cy="60" r="1.6"/>
      <circle class="tw" style="animation-delay:-2s" cx="300" cy="24" r="2"/><circle class="tw" style="animation-delay:-.5s" cx="520" cy="40" r="1.8"/>
      <circle class="tw" style="animation-delay:-1.5s" cx="660" cy="22" r="2"/><circle class="tw" style="animation-delay:-2.2s" cx="760" cy="70" r="1.6"/>
      <circle class="tw" style="animation-delay:-.8s" cx="880" cy="34" r="2.2"/>
    </g>
    <path d="M900 30 a20 20 0 1 0 14 34 a16 16 0 1 1 -14 -34z" fill="#FEF3C7"/>

    <!-- hills + city -->
    <path d="M0 150 Q150 112 300 150 T600 150 T900 140 T1000 150 V220 H0Z" fill="#1E1B4B"/>
    <g fill="#0F0B2A">
      <rect x="60" y="128" width="28" height="70"/><rect x="92" y="108" width="34" height="90"/>
      <rect x="130" y="140" width="24" height="58"/><rect x="170" y="120" width="30" height="78"/>
      <rect x="650" y="132" width="26" height="66"/><rect x="680" y="112" width="34" height="86"/>
      <rect x="718" y="138" width="24" height="60"/>
    </g>
    <g fill="#FDE68A">
      <rect class="tw" x="68" y="140" width="5" height="6"/><rect class="tw" style="animation-delay:-1s" x="76" y="156" width="5" height="6"/>
      <rect class="tw" style="animation-delay:-.4s" x="100" y="122" width="5" height="6"/><rect class="tw" style="animation-delay:-1.7s" x="112" y="140" width="5" height="6"/>
      <rect class="tw" style="animation-delay:-2s" x="178" y="134" width="5" height="6"/><rect class="tw" style="animation-delay:-.7s" x="188" y="152" width="5" height="6"/>
      <rect class="tw" style="animation-delay:-1.2s" x="658" y="146" width="5" height="6"/>
      <rect class="tw" style="animation-delay:-.2s" x="690" y="126" width="5" height="6"/><rect class="tw" style="animation-delay:-1.9s" x="702" y="146" width="5" height="6"/>
      <rect class="tw" style="animation-delay:-1.4s" x="726" y="152" width="5" height="6"/>
    </g>
    <path d="M0 192 Q200 164 420 192 T860 188 T1000 184 V220 H0Z" fill="#17123B"/>

    <!-- rocket -->
    <g class="rk">
      <g transform="rotate(58)">
        <path class="fire" d="M-6 16 Q0 40 6 16Z" fill="#FBBF24"/>
        <path d="M-10 6 L-19 20 L-10 17Z" fill="#F472B6"/><path d="M10 6 L19 20 L10 17Z" fill="#F472B6"/>
        <path d="M0 -24 Q11 -8 11 10 V17 H-11 V10 Q-11 -8 0 -24Z" fill="#F8FAFC" stroke="#A78BFA" stroke-width="2"/>
        <circle cx="0" cy="-4" r="4.5" fill="#38BDF8" stroke="#1E1B4B" stroke-width="1.5"/>
      </g>
    </g>

    <text x="430" y="82" text-anchor="middle" font-size="34" font-weight="900" fill="#FEF3C7" letter-spacing="5" stroke="#312E81" stroke-width="7" stroke-linejoin="round" paint-order="stroke">KEEP LEARNING</text>
    <text x="430" y="122" text-anchor="middle" font-size="34" font-weight="900" fill="#BAE6FD" letter-spacing="5" stroke="#312E81" stroke-width="7" stroke-linejoin="round" paint-order="stroke">KEEP BUILDING</text>
  </g>
</svg>